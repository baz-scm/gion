name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Full CI on the tagged commit. The release job below needs it, so a red
  # CI means no release.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Make this release baz-scm/gion-action's default gion. Its bump-gion
  # workflow tests it, tags the next v1.x.y and moves v1. Runs only once
  # GoReleaser has published binaries, and never for pre-releases
  # (v0.3.0-rc.1). GION_ACTION_TOKEN: fine-grained PAT or app token with
  # contents write on baz-scm/gion-action.
  bump-action:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GION_ACTION_TOKEN }}
        run: |
          gh api repos/baz-scm/gion-action/dispatches \
            -f event_type=gion-release -f "client_payload[version]=$GITHUB_REF_NAME"
