name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow calls this, so a release can't ship unless CI
  # passes on the exact tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Dogfooding: check out with gion instead of actions/checkout, so every
      # run also tests that gion can clone. gion-action installs the newest
      # gion release (release.yml bumps its default).
      - uses: baz-scm/gion-action/checkout@v1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: docs/reference.md is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! go run . help --reference | diff -u docs/reference.md -; then
            echo "::error::docs/reference.md is stale; regenerate it with go run . help --reference > docs/reference.md"
            exit 1
          fi

  # Builds every release artifact without publishing, so a broken
  # .goreleaser.yaml fails here instead of at tag time. Skipped when the
  # release workflow runs CI for a tag: the real release build follows.
  # A snapshot doesn't need a git repo (GoReleaser uses placeholder version
  # info), so gion can check it out; the real release still needs .git.
  release-dry-run:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      # Dogfooding: check out with gion instead of actions/checkout, so every
      # run also tests that gion can clone. gion-action installs the newest
      # gion release (release.yml bumps its default).
      - uses: baz-scm/gion-action/checkout@v1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
