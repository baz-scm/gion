name: pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Checked out with gion, like CI.
      - name: Install gion (latest release)
        run: |
          gh release download -R baz-scm/gion --pattern "gion_*_linux_amd64.tar.gz" -O - | tar -xz -C "$RUNNER_TEMP" gion
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check out the docs with gion
        run: gion clone "$GITHUB_REPOSITORY" . --ref "$GITHUB_SHA" --path docs --path mkdocs.yml --md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "mkdocs-material==9.6.*"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
