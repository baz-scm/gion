{% extends "base.html" %}

{% block extrahead %}
  {% if page %}
    {% set title = config.site_name if page.is_homepage else page.title ~ " - " ~ config.site_name %}
    {% set description = page.meta.description or config.site_description %}
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ config.site_name }}">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:url" content="{{ page.canonical_url }}">
    <meta property="og:image" content="{{ config.site_url }}assets/social.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">
    <meta name="twitter:image" content="{{ config.site_url }}assets/social.png">
  {% endif %}
{% endblock %}
