site_name: gion
site_description: Asymmetric git client for agents. Skip the heavy network on large repos, get only what you need.
site_url: https://baz-scm.github.io/gion/
repo_url: https://github.com/baz-scm/gion
repo_name: baz-scm/gion
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: baz/mark
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Light mode }

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - CI: ci.md
  - Agents: agents.md
  - Workflows:
      - Workspaces: workspaces.md
      - Branches & rebase: branches.md
      - Search & history: search-and-history.md
  - Command reference: reference.md
  - How it works: how-it-works.md
  - Performance: performance.md
  - Limitations & FAQ: limitations.md
